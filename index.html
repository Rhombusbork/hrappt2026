<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b111e">
  <title>HRA 2026 · 송년회 진행 슬라이드</title>
  <link rel="stylesheet" href="./stage.css">
  <link rel="stylesheet" href="./effects/cover.css">
  <link rel="stylesheet" href="./effects/owl-letter.css">
  <link rel="stylesheet" href="./effects/invite-close.css">
  <link rel="stylesheet" href="./effects/awards.css">
  <link rel="stylesheet" href="./effects/banners.css">
  <link rel="stylesheet" href="./effects/blackout.css">
  <link rel="stylesheet" href="./effects/film.css">
  <link rel="stylesheet" href="./effects/capsule.css">
  <link rel="stylesheet" href="./effects/door.css">
  <link rel="stylesheet" href="./effects/starfall.css">
  <script src="./slides.js" defer></script>
  <script src="./effects/cover.js" defer></script>
  <script src="./effects/owl-letter.js" defer></script>
  <script src="./effects/invite-close.js" defer></script>
  <script src="./effects/awards.js" defer></script>
  <script src="./effects/banners.js" defer></script>
  <script src="./effects/blackout.js" defer></script>
  <script src="./effects/film.js" defer></script>
  <script src="./effects/capsule.js" defer></script>
  <script src="./effects/door.js" defer></script>
  <script src="./effects/starfall.js" defer></script>
  <script src="./stage.js" defer></script>
</head>
<body>
  <header class="top">
    <span class="brand"><b>✧</b> HRA <small>2026</small></span>
    <span class="top-title">YEAR-END PARTY <i></i> 본 행사 진행</span>
    <div class="tools"><button id="contents">☰ <span>식순</span></button><button id="presenter">사회자</button><button id="staff">운영 패널</button></div>
  </header>
  <main class="workspace">
    <div id="stage" class="stage" aria-label="발표 화면">
      <section id="slide" class="slide" aria-live="polite"></section>
      <p id="caption" class="stage-caption" hidden></p>
    </div>
  </main>
  <footer class="controls">
    <div class="position"><strong id="number">01</strong><span id="total"> / 26</span><div class="progress"><i id="progress"></i></div></div>
    <nav aria-label="슬라이드 이동"><button id="prev" aria-label="이전 슬라이드">←</button><button id="next">다음 <span>→</span></button></nav>
    <button id="fullscreen">⛶ <span>전체화면</span></button>
  </footer>
  <dialog id="agenda"><header><h2>오늘의 식순</h2><button data-close aria-label="닫기">×</button></header><ol id="agenda-list"></ol></dialog>
  <dialog id="operator"><header><h2>현장 운영 패널</h2><button data-close aria-label="닫기">×</button></header>
    <p>DEMO / 이 브라우저에 저장됩니다.</p>
    <form id="score-form"><h3>기숙사 누적 점수</h3><div id="score-inputs"></div><button>점수 저장</button></form>
    <form id="guest-form"><h3>내빈 학생증 · 시연 명단</h3><div id="guest-list"></div><label>이름 <input name="guest" maxlength="24" required></label><label>소속 <input name="role" maxlength="30" required></label><label>하는 일 <input name="occupation" maxlength="30"></label><label>취미 <input name="hobby" maxlength="30"></label><label>학생증 이미지 <input name="card" type="file" accept="image/*"></label><button>추가</button></form>
    <section id="media-settings" aria-labelledby="media-title"><h3 id="media-title">사진과 영상 준비</h3>
      <label>어린 시절 퀴즈 교수님 번호 <select id="media-card"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
      <label>어린 시절 사진 <input id="child-file" type="file" accept="image/*"></label>
      <label>현재 사진 <input id="adult-file" type="file" accept="image/*"></label>
      <label>정답에 표시할 이름 <input id="photo-answer-name" maxlength="28" placeholder="선택 사항"></label>
      <label>20기 활동 영상 <input id="activity-file" type="file" accept="video/*"></label>
      <p id="media-status" role="status"></p>
    </section>
  </dialog>
</body>
</html>
